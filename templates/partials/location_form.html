{% macro location_form(datalist_id) %}
<form method="POST" action="{{ url_for('user.update_location') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label small mb-1">当前所在地</label>
    <input class="form-control form-control-sm" name="location" list="{{ datalist_id }}" value="{{ current_location }}">
    <datalist id="{{ datalist_id }}">
        {% for loc in location_options %}
            <option value="{{ loc }}"></option>
        {% endfor %}
    </datalist>
    <div class="text-muted small mt-2">输入城市或社区名</div>
    <button class="btn btn-primary btn-sm w-100 mt-2" type="submit">更新定位</button>
</form>
{% endmacro %}
