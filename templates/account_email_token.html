<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>账号邮箱确认</title></head><body><main><h1>{{ '确认找回邮箱' if purpose == 'verify' else '设置新密码' }}</h1><p>链接15分钟内有效，仅能使用一次。此页面只加载本网站脚本。</p>{% if error %}<p role="alert">{{ error }}。请重新打开原邮件链接或申请新链接。</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="purpose" value="{{ purpose }}"><input type="hidden" name="token" id="email-token">{% if purpose == 'reset' %}<label>新密码（8–100位）<input type="password" name="new_password" minlength="8" maxlength="100" autocomplete="new-password" required></label><label>再次输入<input type="password" name="confirm_password" minlength="8" maxlength="100" autocomplete="new-password" required></label>{% endif %}<button type="submit">{{ '确认邮箱' if purpose == 'verify' else '重置密码' }}</button></form><a href="{{ url_for('public.forgot_password') }}">重新申请找回</a></main><script src="{{ url_for('static', filename='js/account-email-token.js') }}"></script></body></html>
