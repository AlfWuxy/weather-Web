name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    name: Python 完整测试（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 安装依赖
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check

      - name: 验证和风天气私钥跨 UID 权限
        shell: bash
        run: |
          python_path="$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          test -x "$python_path"
          sudo -E env PYTHONDONTWRITEBYTECODE=1 "$python_path" -m pytest -q -p no:cacheprovider \
            tests/test_qweather_key_permissions_linux.py

      - name: 检查 Python 与 Shell 语法
        run: |
          python -m compileall -q app.py blueprints core services utils
          for file in scripts/*.sh .githooks/*; do
            bash -n "$file"
          done

      - name: 检查变更与仓库边界
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git show --check --oneline --no-renames HEAD
          fi

          forbidden=$(
            git ls-files \
              | grep -E '(^\.env($|\.)|^\.claude/|^\.superpowers/|^\.playwright-cli/|^output/|^backups/| 2\.|\.DS_Store$)' \
              | grep -vE '^\.env\.(wechat-release\.)?example$' \
              || true
          )
          if [ -n "$forbidden" ]; then
            printf '发现禁止提交的文件：\n%s\n' "$forbidden" >&2
            exit 1
          fi

          if git grep -nE \
            '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
            -- . ':(exclude)tests/**' ':(exclude).github/workflows/ci.yml'; then
            echo '发现疑似真实密钥或私钥。' >&2
            exit 1
          fi

          oversized=0
          while IFS= read -r -d '' file; do
            bytes=$(wc -c < "$file")
            if [ "$bytes" -gt 10485760 ]; then
              echo "文件超过 10 MB: $file ($bytes bytes)" >&2
              oversized=1
            fi
          done < <(git ls-files -z)
          test "$oversized" -eq 0

      - name: 检查已跟踪文件密钥
        run: python scripts/check_tracked_secrets.py

      - name: 运行完整测试并检查弃用警告
        run: >-
          python -m pytest -q
          --ignore=tests/test_activate_release.py
          -W error::DeprecationWarning
          -W ignore::DeprecationWarning:flask_login.login_manager

      - name: 运行离线手工契约测试
        run: python -m pytest -q -m "manual and not network"

  activation:
    name: 发布激活事务测试（分片 ${{ matrix.shard }}/4）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 配置 Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 安装依赖
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check

      - name: 运行发布激活事务分片
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "4"
        run: |
          python - <<'PY'
          import os

          import pytest

          total = int(os.environ['SHARD_TOTAL'])
          shard = int(os.environ['SHARD_INDEX'])
          if total <= 0 or not 0 <= shard < total:
              raise SystemExit('分片参数无效')

          class ShardPlugin:
              def pytest_collection_modifyitems(self, config, items):
                  selected = []
                  deselected = []
                  for index, item in enumerate(items):
                      target = selected if index % total == shard else deselected
                      target.append(item)
                  items[:] = selected
                  config.hook.pytest_deselected(items=deselected)

          raise SystemExit(pytest.main([
              '-q',
              '-W', 'error::DeprecationWarning',
              '-W', 'ignore::DeprecationWarning:flask_login.login_manager',
              'tests/test_activate_release.py',
          ], plugins=[ShardPlugin()]))
          PY

  web-js:
    name: Web 前端运行测试
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 配置 Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: 检查 Web 地图脚本语法
        run: |
          node --check static/js/heat-vulnerability-preview.js
          node --check static/js/heat-exposure-gis.js

      - name: 运行 Web 地图真实行为测试
        run: node --test tests/*.test.js tests/js/*.test.mjs

  release-proof:
    name: 可发布提交证明
    needs:
      - test
      - activation
      - web-js
    if: ${{ github.event_name == 'push' && needs.test.result == 'success' && needs.activation.result == 'success' && needs.web-js.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 记录已验证提交
        run: printf '已验证提交：%s\n' "$GITHUB_SHA"
